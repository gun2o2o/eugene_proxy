[credentials]
# 유진투자증권 로그인 정보
user_id =
user_pw =
cert_pw =
# 계좌 비밀번호 (잔고조회, 주문 등에 사용)
acct_pw =

[server]
# TCP 프록시 서버 설정
host = 127.0.0.1
port = 5959

[openapi]
# Champion OpenAPI 설치 경로
openapi_path = C:\EugeneFN\ChampionOPENAPI
# COM ProgID (변경 불필요)
com_prog_id = CHAMPIONCOMMAGENT.ChampionCommAgentCtrl.1

[options]
# 접속 모드: real = 실거래, test = 모의투자
mode = real
# 버전처리 스킵: false = 정상 버전처리 (권장), true = 스킵 (wparam=0)
skip_version = false
# 로그인 타임아웃 (초)
login_timeout = 30
# 버전처리 타임아웃 (초)
version_timeout = 30
# TR 응답 타임아웃 (초)
tr_timeout = 10
# 큐 폴링 간격 (밀리초)
poll_interval_ms = 10
# 로그 레벨: DEBUG, INFO, WARNING, ERROR
log_level = INFO
